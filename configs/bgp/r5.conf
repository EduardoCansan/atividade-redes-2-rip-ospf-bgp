configure terminal
router bgp 300
 neighbor 10.0.35.2 remote-as 200
 neighbor 10.0.45.2 remote-as 200
 !
 address-family ipv4 unicast
  network 192.168.50.0/24
  neighbor 10.0.35.2 route-map PERMIT-ALL in
  neighbor 10.0.35.2 route-map PERMIT-ALL out
  neighbor 10.0.45.2 route-map PERMIT-ALL in
  neighbor 10.0.45.2 route-map PERMIT-ALL out
 exit-address-family
exit
route-map PERMIT-ALL permit 10
end
