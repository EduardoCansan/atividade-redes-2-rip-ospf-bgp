configure terminal
router bgp 200
 neighbor 10.0.12.2 remote-as 100
 neighbor 10.0.23.3 remote-as 200
 neighbor 10.0.24.3 remote-as 200
 !
 address-family ipv4 unicast
  network 10.0.23.0/29
  neighbor 10.0.12.2 route-map PERMIT-ALL in
  neighbor 10.0.12.2 route-map PERMIT-ALL out
  neighbor 10.0.23.3 next-hop-self
  neighbor 10.0.24.3 next-hop-self
 exit-address-family
exit
route-map PERMIT-ALL permit 10
end
